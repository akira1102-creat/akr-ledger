  <h2>資料責任</h2>

  <h2>合理使用</h2>
  <p>你不得未經授權存取他人資料、干擾服務或將App用於違法活動。</p>

  <h2>變更及終止</h2>
  <p>功能及條款可能因安全、合規或產品改善而更新。重大變更會在App或商店頁通知。</p>
