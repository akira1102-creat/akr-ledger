<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="錢有數" />
  <!-- iOS Home Screen mode: the inline theme bootstrap changes this to
       black-translucent before React renders when dark mode is active. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="manifest" href="./assets/manifest-D8D8Hmm9.json" />
  <link rel="icon" href="./assets/icon-192-CTTiAWij.png" type="image/png" />
  <title>錢有數</title>
  <script>
    (function () {
      var theme = localStorage.getItem("akr-theme") || "system";
      var dark = theme === "dark" ||
        (theme === "system" && window.matchMedia("(prefers-color-scheme:dark)").matches);
      if (dark) document.documentElement.classList.add("dark");
      // Android Chrome must follow the app theme, including a saved override.
      document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#1f2937" : "#ffffff");
      var statusBar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
      if (statusBar) statusBar.setAttribute("content", dark ? "black-translucent" : "default");
      if ((localStorage.getItem("akr-accent") || "sky") === "sky") {
        document.documentElement.classList.add("accent-sky");
      }
    })();
  </script>
